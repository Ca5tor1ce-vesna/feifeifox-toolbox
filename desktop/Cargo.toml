[package]
name = "feifeifox-toolbox"
version = "1.2.2"
description = "绯绯狐工具箱"
edition = "2021"
publish = false

# 2026-11-04 用户决定 exe 改用 Rust 打包（Tauri，用系统自带的 WebView2）：
# 整个工具箱是静态站点（tools/build_site.mjs → build/site），编译时嵌进 exe；存档写在 exe 旁边的 userdata/。
[[bin]]
name = "FeifeiFoxToolbox"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# UID 查询（Enka）：网页请求会被跨域拦下，由 exe 发请求（1.2，只在 exe 里有）。
ureq = { version = "2", default-features = false, features = ["tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
