name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: 安装开发检查工具
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 类型检查
        run: npm run typecheck
      - name: 行动轴引擎测试
        run: npm run test:axis
      - name: 功能页测试（各功能页、分层依赖和基础格式）
        run: npm run test:pages
      # 下面两步只在带测试服目录的开发仓库里跑（公开仓库没有这个目录）。
      - name: 测试服和导出规则测试
        if: hashFiles('beta/tests/publish.test.ts') != ''
        run: npm run test:axis:beta
      - name: 导入器和资料来源检查
        if: hashFiles('beta/tests/test_importers.py') != ''
        run: python -m unittest discover -s beta/tests
      - name: 浏览器检查
        shell: pwsh
        run: ./tools/verify_ci_ui.ps1
