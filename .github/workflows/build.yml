# 在 Windows 上打发布包：免安装版 exe（Rust 外壳，desktop/）+ B站 Toy 网页包。2026-11-04 起不再用 Python。
# 触发：推送 v* 标签、手动运行（Actions → build → Run workflow）。
# 产物：推 tag 时发布到 Release；手动运行时只上传 Artifacts（在运行页面下载）。
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    # 建 Release 需要写权限：新建仓库的 GITHUB_TOKEN 默认只读，不显式声明会 403。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装开发检查工具
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 测试
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:axis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify_ci_ui.ps1

      # windows-latest 自带 Rust（rustup，MSVC 工具链）和 WebView2。
      - name: 打包（exe + B站 Toy 网页包 + 发布说明，带审计）
        run: node tools/package.mjs

      # 排在冒烟前面：冒烟失败时包也能下载下来自己试。Release 的发布步骤还在冒烟后面，没过不会发。
      - uses: actions/upload-artifact@v4
        with:
          name: feifeifox-toolbox-release
          path: |
            dist/feifeifox-toolbox-v*-portable.zip
            dist/feifeifox-toolbox-v*-toy.zip
            dist/feifeifox-toolbox-v*-notes.md
          if-no-files-found: error

      - name: 冒烟：解压后启动 exe，确认窗口里的页面打开了
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "没有找到免安装版 zip" }
          $dir = Join-Path $env:RUNNER_TEMP "免安装 测试"
          Expand-Archive $zip.FullName -DestinationPath $dir -Force
          foreach ($need in "FeifeiFoxToolbox.exe","使用说明.html","userdata") {
            if (-not (Test-Path (Join-Path $dir $need))) { throw "缺少 $need" }
          }
          # 调试端口让系统挑一个空闲的：CI 机器上 Windows 会保留一些端口段，写死 9452 时 WebView2 开不了端口（2026-11-05 实测：进程和 WebView2 都起来了，端口连不上）。
          $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $listener.Start(); $port = $listener.LocalEndpoint.Port; $listener.Stop()
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=$port"
          # CI 上光靠环境变量，WebView2 主进程的参数里没有调试端口（2026-11-05 诊断输出）。再用 WebView2 的
          # 「按 exe 名附加参数」策略写进这台 CI 机器的当前用户注册表，策略不经过 exe 的启动环境。只在 CI 上这样做。
          $policy = "HKCU:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments"
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name "FeifeiFoxToolbox.exe" -Value "--remote-debugging-port=$port" -PropertyType String -Force | Out-Null
          $p = Start-Process -FilePath (Join-Path $dir "FeifeiFoxToolbox.exe") -PassThru
          $ok = $false
          $last = "调试端口一直连不上"
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $pages = Invoke-RestMethod "http://127.0.0.1:$port/json/list"
              $last = "调试端口里的页面：" + (($pages | ForEach-Object { "$($_.type) $($_.url)" }) -join "；")
              if ($pages | Where-Object { $_.url -like "*tauri.localhost*" }) { $ok = $true; break }
            } catch { $last = "调试端口连不上：$($_.Exception.Message)" }
          }
          if (-not $ok) {
            # CI 上失败过、本机复现不了（2026-11-05）：失败时把能看到的都打出来，好判断是进程没起来、窗口建不了还是端口没开。
            Write-Host "进程还在：$(-not $p.HasExited)；退出码：$(if ($p.HasExited) { $p.ExitCode } else { '-' })"
            Write-Host "当前会话：$([Diagnostics.Process]::GetCurrentProcess().SessionId)；交互桌面：$([Environment]::UserInteractive)"
            Write-Host $last
            $views = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
            Write-Host "msedgewebview2 进程：$($views.Count) 个；会话：$(($views | ForEach-Object SessionId | Sort-Object -Unique) -join ',')"
            $main = Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | Select-Object -First 1
            Write-Host "调试端口 $port；WebView2 主进程参数：$(if ($main) { $main.CommandLine } else { '没找到' })"
            Write-Host "附加参数策略：$((Get-ItemProperty $policy -ErrorAction SilentlyContinue).'FeifeiFoxToolbox.exe')"
            $self = Get-CimInstance Win32_Process -Filter "ProcessId = $($p.Id)"
            Write-Host "exe 进程：$(if ($self) { $self.CommandLine } else { '已退出' })"
            Write-Host "系统保留的端口段："; netsh int ipv4 show excludedportrange protocol=tcp | Write-Host
            $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue
            Write-Host "WebView2 运行时版本：$(if ($runtime) { $runtime.pv } else { '没找到' })"
            $data = Join-Path $env:LOCALAPPDATA "com.feifeifox.toolbox"
            Write-Host "WebView2 数据目录：$(if (Test-Path $data) { (Get-ChildItem $data -Name) -join ', ' } else { '没有建出来' })"
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe 启动后 40 秒内页面没有打开" }
          Write-Host "冒烟通过"

      # exe 自动更新（1.3）：给冒烟过的 exe 签名，写出 -update.exe 和 latest.json（tools/update_sign.mjs）。
      # 私钥在仓库 Secret UPDATE_SIGNING_KEY；要发 Release 时没有私钥就停下，免得发出一个老用户收不到更新的版本。
      - name: 签名自动更新文件
        shell: pwsh
        run: |
          $release = "${{ startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private }}" -eq "true"
          if (-not $env:UPDATE_SIGNING_KEY) {
            if ($release) { throw "没有签名私钥：在公开仓库 Settings → Secrets → Actions 加 UPDATE_SIGNING_KEY" }
            Write-Host "没有签名私钥，跳过（只有发 Release 时必须有）"
            exit 0
          }
          node tools/update_sign.mjs release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}

      # 手动运行只上传 Actions 产物；标签运行创建或更新对应的 Release。
      - name: 发布
        # 只在公开仓库发布：开发仓库是私有的，在那里推了标签也只构建、不发 Release，免得同一个版本有两个出处。
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        shell: pwsh
        run: |
          # 先确认 tag 和代码里的版本号一致 —— 不一致就停在这里，别发出一个名字对不上的包。
          $tag = "${{ github.ref_name }}"
          $codeVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag  代码版本=$codeVersion"
          if ("v$codeVersion" -ne $tag) {
            throw "tag（$tag）和 package.json 的版本（v$codeVersion）不一致：先改版本号再打 tag"
          }
          # latest.json 必须叫这个名字：exe 从「最新 Release」的固定下载地址读它（预发布不算最新，不会推给用户）。
          $files = @("dist/feifeifox-toolbox-v$codeVersion-portable.zip", "dist/feifeifox-toolbox-v$codeVersion-toy.zip", "dist/feifeifox-toolbox-v$codeVersion-update.exe", "dist/latest.json")
          $notes = "dist/feifeifox-toolbox-v$codeVersion-notes.md"
          foreach ($file in $files + $notes) { if (-not (Test-Path -LiteralPath $file)) { throw "缺少发布附件 $file" } }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          # Release 标题统一成「绯绯狐工具箱 v1.x」（2026-11-06 用户要求），以前只写 tag，每版都要手动改。
          $title = "绯绯狐工具箱 $tag"
          # 带后缀的版本（如 1.1.0-beta.1）按预发布发，且不抢「Latest」。
          if ($codeVersion -match '[A-Za-z]') {
            gh release create $tag @files --title $title --notes-file $notes --verify-tag --prerelease --latest=false
          } else {
            gh release create $tag @files --title $title --notes-file $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
