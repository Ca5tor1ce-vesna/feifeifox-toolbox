# 在 Windows 上打发布包：免安装版 exe（Rust 外壳，desktop/）+ B站 Toy 网页包。2026-11-04 起不再用 Python。
# 触发：推送 v* 标签、手动运行（Actions → build → Run workflow）。
# 产物：推 tag 时发布到 Release；手动运行时只上传 Artifacts（在运行页面下载）。
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    # 建 Release 需要写权限：新建仓库的 GITHUB_TOKEN 默认只读，不显式声明会 403。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 安装开发检查工具
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 测试
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:axis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/verify_ci_ui.ps1

      # windows-latest 自带 Rust（rustup，MSVC 工具链）和 WebView2。
      - name: 打包（exe + B站 Toy 网页包 + 发布说明，带审计）
        run: node tools/package.mjs

      - name: 冒烟：解压后启动 exe，确认窗口里的页面打开了
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-portable.zip" | Select-Object -First 1
          if (-not $zip) { throw "没有找到免安装版 zip" }
          $dir = Join-Path $env:RUNNER_TEMP "免安装 测试"
          Expand-Archive $zip.FullName -DestinationPath $dir -Force
          foreach ($need in "FeifeiFoxToolbox.exe","使用说明.html","userdata") {
            if (-not (Test-Path (Join-Path $dir $need))) { throw "缺少 $need" }
          }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9452"
          $p = Start-Process -FilePath (Join-Path $dir "FeifeiFoxToolbox.exe") -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $pages = Invoke-RestMethod "http://127.0.0.1:9452/json/list"
              if ($pages | Where-Object { $_.url -like "*tauri.localhost*" }) { $ok = $true; break }
            } catch {}
          }
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "exe 启动后 40 秒内页面没有打开" }
          Write-Host "冒烟通过"

      - uses: actions/upload-artifact@v4
        with:
          name: feifeifox-toolbox-release
          path: |
            dist/feifeifox-toolbox-v*-portable.zip
            dist/feifeifox-toolbox-v*-toy.zip
            dist/feifeifox-toolbox-v*-notes.md
          if-no-files-found: error

      # 手动运行只上传 Actions 产物；标签运行创建或更新对应的 Release。
      - name: 发布
        # 只在公开仓库发布：开发仓库是私有的，在那里推了标签也只构建、不发 Release，免得同一个版本有两个出处。
        if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
        shell: pwsh
        run: |
          # 先确认 tag 和代码里的版本号一致 —— 不一致就停在这里，别发出一个名字对不上的包。
          $tag = "${{ github.ref_name }}"
          $codeVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=$tag  代码版本=$codeVersion"
          if ("v$codeVersion" -ne $tag) {
            throw "tag（$tag）和 package.json 的版本（v$codeVersion）不一致：先改版本号再打 tag"
          }
          $files = @("dist/feifeifox-toolbox-v$codeVersion-portable.zip", "dist/feifeifox-toolbox-v$codeVersion-toy.zip")
          $notes = "dist/feifeifox-toolbox-v$codeVersion-notes.md"
          foreach ($file in $files + $notes) { if (-not (Test-Path -LiteralPath $file)) { throw "缺少发布附件 $file" } }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            exit 0
          }
          # 带后缀的版本（如 1.1.0-beta.1）按预发布发，且不抢「Latest」。
          if ($codeVersion -match '[A-Za-z]') {
            gh release create $tag @files --title $tag --notes-file $notes --verify-tag --prerelease --latest=false
          } else {
            gh release create $tag @files --title $tag --notes-file $notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
